name: Product quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild without network collection
        run: python build.py
      - name: Regression tests
        run: python -m unittest discover -s automation -p 'test_*.py'
      - name: Content and page gates
        run: |
          python automation/validate_project.py --all
          python automation/validate_product.py
